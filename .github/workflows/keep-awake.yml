# Keeps the free Supabase database from pausing (it pauses after 7 days with no visits).
# Runs every 3 days and makes one tiny read. Uses only the public "publishable" key.
name: Keep the database awake
on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -sS -o /dev/null -w "%{http_code}\n" \
            "https://gkedbgcrgrzlfrxhrkdv.supabase.co/rest/v1/weddings?select=id&limit=1" \
            -H "apikey: sb_publishable_Rhuu-ALFLdDaBNo5liJ1Ew_V5kWhGbY"
