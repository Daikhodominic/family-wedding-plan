<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>RSVPs · Charani &amp; Adahrii</title>
<link rel="icon" href="../assets/wreath_blue.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Pinyon+Script&display=swap">
<style>
  :root { --paper: #F6F4EF; --ink: #1F2533; --soft: #4A5468; --blue: #0E4A70; --blue-2: #2F6690; --line: #D9DEE6; --no: #8A3B3B; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: 'Cormorant Garamond', Georgia, serif; font-size: 18px; line-height: 1.45; font-variant-numeric: lining-nums; }
  main { max-width: 760px; margin: 0 auto; padding: 28px 16px 56px; }
  h1 { margin: 0; text-align: center; font-family: 'Pinyon Script', cursive; font-weight: 400; font-size: 46px; color: var(--blue); }
  .sub { text-align: center; text-transform: uppercase; letter-spacing: 0.2em; font-size: 13px; font-weight: 600; color: var(--blue-2); margin-top: 4px; }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 24px 0 18px; }
  .stat { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 12px 6px; text-align: center; }
  .stat b { display: block; font-size: 32px; font-weight: 500; color: var(--blue); line-height: 1.05; }
  .stat span { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600; color: var(--soft); }
  @media (max-width: 420px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  button, .btn { min-height: 44px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--blue); background: transparent; color: var(--blue); font: 600 14px 'Cormorant Garamond', serif; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
  button[aria-pressed=true] { background: var(--blue); color: #fff; }
  button:focus-visible, .btn:focus-visible { outline: 3px solid #8FB3D4; outline-offset: 2px; }
  .list { display: grid; gap: 10px; }
  .item { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; }
  .row { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .name { font-size: 20px; font-weight: 600; }
  .tag { font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; }
  .tag.yes { color: var(--blue); } .tag.no { color: var(--no); }
  .meta { font-size: 15px; color: var(--soft); margin-top: 2px; }
  .meta a { color: var(--blue); }
  .msg { margin-top: 6px; font-style: italic; }
  .note { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 22px; text-align: center; margin-top: 24px; }
  .note a { color: var(--blue); font-weight: 600; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Charani &amp; Adahrii</h1>
  <div class="sub">Invitation replies</div>

  <div class="note" id="state">Loading the replies…</div>

  <div id="app" hidden>
    <div class="stats">
      <div class="stat"><b id="s-guests">0</b><span>Guests coming</span></div>
      <div class="stat"><b id="s-yes">0</b><span>Accepted</span></div>
      <div class="stat"><b id="s-no">0</b><span>Declined</span></div>
      <div class="stat"><b id="s-all">0</b><span>Replies</span></div>
    </div>
    <div class="bar">
      <div class="tabs" role="group" aria-label="Show">
        <button type="button" data-f="all" aria-pressed="true">All</button>
        <button type="button" data-f="yes" aria-pressed="false">Coming</button>
        <button type="button" data-f="no" aria-pressed="false">Not coming</button>
      </div>
      <div class="tabs">
        <button type="button" id="refresh">Refresh</button>
        <button type="button" id="csv">Download list</button>
      </div>
    </div>
    <div class="list" id="list"></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script type="module">
  import { SUPABASE_URL, SUPABASE_KEY } from '../js/config.js';
  const el = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  let rows = [], filter = 'all';

  // Same login as the War Room (it is saved on this phone once you've joined there).
  const sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true } }) : null;

  function needLogin(msg) {
    el('app').hidden = true;
    el('state').hidden = false;
    el('state').innerHTML = esc(msg) + '<br><br><a href="../index.html">Open the War Room</a>, sign in with the family passcode, then come back to this page.';
  }

  async function load() {
    if (!sb) return needLogin('Could not reach the database. Check your internet and try again.');
    const { data: s } = await sb.auth.getSession();
    if (!s.session) return needLogin('Only the family can see the replies.');
    const { data, error } = await sb.from('rsvps').select('*').order('created_at', { ascending: false });
    if (error) {
      if (/relation .*rsvps|does not exist/i.test(error.message)) return needLogin('The replies list is not set up yet. The admin needs to run update 16 (supabase/016_rsvps.sql) in Supabase once.');
      return needLogin('Could not load the replies (' + error.message + ').');
    }
    rows = data || [];
    el('state').hidden = true; el('app').hidden = false;
    render();
  }

  function render() {
    const yes = rows.filter(r => r.attending), no = rows.filter(r => !r.attending);
    el('s-guests').textContent = yes.reduce((n, r) => n + (r.guests || 0), 0);
    el('s-yes').textContent = yes.length;
    el('s-no').textContent = no.length;
    el('s-all').textContent = rows.length;
    const show = filter === 'yes' ? yes : filter === 'no' ? no : rows;
    el('list').innerHTML = show.length ? show.map(r => {
      const when = new Date(r.created_at).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
      const phone = r.phone ? ` · <a href="tel:${esc(r.phone)}">${esc(r.phone)}</a>` : '';
      return `<div class="item"><div class="row"><span class="name">${esc(r.name)}</span>
        <span class="tag ${r.attending ? 'yes' : 'no'}">${r.attending ? `Coming · ${r.guests}` : 'Not coming'}</span></div>
        <div class="meta">${esc(when)}${phone}</div>${r.message ? `<div class="msg">“${esc(r.message)}”</div>` : ''}</div>`;
    }).join('') : '<div class="note">No replies here yet.</div>';
  }

  document.querySelectorAll('[data-f]').forEach(b => b.addEventListener('click', () => {
    filter = b.dataset.f;
    document.querySelectorAll('[data-f]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    render();
  }));
  el('refresh').addEventListener('click', load);
  el('csv').addEventListener('click', () => {
    const q = (v) => '"' + String(v ?? '').replace(/"/g, '""') + '"';
    const lines = [['Name', 'Coming', 'How many', 'Phone', 'Message', 'Replied on'].map(q).join(',')]
      .concat(rows.map(r => [r.name, r.attending ? 'Yes' : 'No', r.guests, r.phone, r.message, new Date(r.created_at).toLocaleString('en-IN')].map(q).join(',')));
    const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'Charani-Adahrii-RSVPs.csv'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  });

  load().catch(() => needLogin('Could not reach the database. Check your internet and try again.'));
</script>
</body>
</html>
